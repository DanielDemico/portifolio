<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Portfolio" />
    <meta name="theme-color" content="#F7F5FB" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Portfolio</title>
    <script>
      // Aplica tema e idioma salvos ANTES da primeira pintura (evita "flash").
      // Padrão: tema claro + inglês.
      (function () {
        try {
          var t = localStorage.getItem('pf-theme');
          var l = localStorage.getItem('pf-lang');
          if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
          if (l === 'pt' || l === 'en') document.documentElement.lang = l === 'pt' ? 'pt-BR' : 'en';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
