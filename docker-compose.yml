# Site + túnel da Cloudflare.
# O site escuta só em 127.0.0.1:8080 na máquina, e nenhuma porta fica aberta para fora:
# o cloudflared abre uma conexão de saída até a Cloudflare e o tráfego chega por ela.
#
# O cloudflared usa a rede do host (como o container `criador-tunel` da VM), então
# as rotas do túnel apontam para `localhost`:
#   danielcezar.com.br             -> http://localhost:8080   (este site)
#   videomaker.danielcezar.com.br  -> http://localhost:8787   (painel, continua funcionando)
#
# O token vem de CLOUDFLARE_TUNNEL_TOKEN: no deploy pelo GitHub Actions, do segredo do
# repositório; manualmente, do arquivo .env ao lado deste (fora do git).

services:
  portfolio:
    build: .
    image: portfolio:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORTFOLIO_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    network_mode: host
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Defina CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      portfolio:
        condition: service_healthy
